<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이차함수 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-6 flex flex-col items-center justify-center font-sans">
  
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row">
    
    <!-- 왼쪽 패널: 입력 및 텍스트 결과 -->
    <div class="w-full md:w-1/2 p-8 bg-white flex flex-col justify-center">
      <div class="flex items-center space-x-3 mb-6 text-blue-600">
        <!-- FunctionSquare 아이콘 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <path d="M9 17c2 0 2.8-1 2.8-2.8V10c0-2 1-3.3 3.2-3"/>
          <path d="M9 11.2h5.7"/>
        </svg>
        <h1 class="text-2xl font-bold text-slate-800">이차함수 계산기</h1>
      </div>
      
      <p class="text-slate-500 mb-8">
        <span class="font-semibold text-slate-700">x</span> 값을 입력하면 즉시 
        <span class="font-semibold text-slate-700 mx-1">y = x²</span> 과 
        <span class="font-semibold text-slate-700 mx-1">y = -x²</span> 의 결과를 보여줍니다.
      </p>

      <div class="mb-8">
        <label for="x-input" class="block text-sm font-semibold text-slate-700 mb-2">
          x 값 입력:
        </label>
        <div class="relative">
          <input
            id="x-input"
            type="number"
            value="2"
            class="w-full text-2xl p-4 pr-12 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-sm font-mono"
            placeholder="숫자를 입력하세요"
          />
          <!-- Calculator 아이콘 -->
          <svg class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="20" x="4" y="2" rx="2"/>
            <line x1="8" x2="16" y1="6" y2="6"/>
            <line x1="16" x2="16" y1="14" y2="18"/>
            <path d="M16 10h.01"/>
            <path d="M12 10h.01"/>
            <path d="M8 10h.01"/>
            <path d="M12 14h.01"/>
            <path d="M8 14h.01"/>
            <path d="M12 18h.01"/>
            <path d="M8 18h.01"/>
          </svg>
        </div>
      </div>

      <div class="space-y-4">
        <!-- y = x^2 결과 카드 -->
        <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex items-center justify-between transition-all hover:shadow-md">
          <div class="flex items-center space-x-3">
            <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
              <!-- TrendingUp 아이콘 -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                <polyline points="16 7 22 7 22 13"/>
              </svg>
            </div>
            <div>
              <div class="text-sm text-slate-500 font-medium">y = x²</div>
              <div class="text-xl font-bold text-slate-800" id="y1-formula">y = (2)²</div>
            </div>
          </div>
          <div class="text-3xl font-black text-blue-600 font-mono break-all" id="y1-result">4</div>
        </div>

        <!-- y = -x^2 결과 카드 -->
        <div class="bg-red-50 p-5 rounded-2xl border border-red-100 flex items-center justify-between transition-all hover:shadow-md">
          <div class="flex items-center space-x-3">
            <div class="bg-red-100 p-2 rounded-lg text-red-600">
              <!-- TrendingDown 아이콘 -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/>
                <polyline points="16 17 22 17 22 11"/>
              </svg>
            </div>
            <div>
              <div class="text-sm text-slate-500 font-medium">y = -x²</div>
              <div class="text-xl font-bold text-slate-800" id="y2-formula">y = -(2)²</div>
            </div>
          </div>
          <div class="text-3xl font-black text-red-600 font-mono break-all" id="y2-result">-4</div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 패널: 시각화 그래프 -->
    <div class="w-full md:w-1/2 bg-slate-50 border-l border-slate-200 p-8 flex flex-col items-center justify-center relative overflow-hidden">
      <div class="absolute top-6 left-6 text-slate-600 text-sm font-medium">
        함수 그래프 시각화 (좌표평면)
      </div>
      
      <div class="w-full max-w-[400px] aspect-square relative mt-8 bg-white border border-slate-200 rounded-xl shadow-sm">
        <svg id="graph-svg" width="100%" height="100%" viewBox="0 0 400 400" class="overflow-hidden rounded-xl">
          <!-- 정적 및 동적 요소들이 JavaScript에 의해 여기에 렌더링됩니다 -->
        </svg>
      </div>

      <div class="mt-8 flex flex-col items-center space-y-4">
        <div class="text-sm text-slate-500">아래 버튼을 눌러 전체 그래프 곡선을 확인하세요</div>
        <div class="flex space-x-4 text-sm">
          <button id="btn-graph-y1" class="flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-slate-200 bg-white hover:bg-slate-50 transition-all font-medium text-slate-600">
            <div class="w-3 h-3 rounded-full bg-blue-500"></div>
            <span>y = x² 그래프</span>
          </button>
          <button id="btn-graph-y2" class="flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-slate-200 bg-white hover:bg-slate-50 transition-all font-medium text-slate-600">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <span>y = -x² 그래프</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const xInput = document.getElementById('x-input');
      const y1Formula = document.getElementById('y1-formula');
      const y1Result = document.getElementById('y1-result');
      const y2Formula = document.getElementById('y2-formula');
      const y2Result = document.getElementById('y2-result');
      const graphSvg = document.getElementById('graph-svg');
      const btnGraphY1 = document.getElementById('btn-graph-y1');
      const btnGraphY2 = document.getElementById('btn-graph-y2');

      // 그래프 표시 상태 변수
      let showGraphY1 = false;
      let showGraphY2 = false;

      // 그래프 상수 설정
      const graphSize = 400;
      const padding = 30;
      const innerSize = graphSize - padding * 2;
      const cx = graphSize / 2;
      const cy = graphSize / 2;
      const maxAbsX = 10;
      const maxY = 100;

      // 좌표 매핑 함수
      const mapX = (val) => cx + (val / maxAbsX) * (innerSize / 2);
      const mapY = (val) => cy - (val / maxY) * (innerSize / 2);

      // 정적 요소 (격자, 축) 미리 생성
      let staticSvgContent = `<g stroke="#e2e8f0" stroke-width="1">`;
      
      // 배경 격자선
      for (let i = -10; i <= 10; i += 2) {
        if (i !== 0) {
          const x = mapX(i);
          staticSvgContent += `<line x1="${x}" y1="0" x2="${x}" y2="400" />`;
        }
      }
      for (let i = -100; i <= 100; i += 20) {
        if (i !== 0) {
          const y = mapY(i);
          staticSvgContent += `<line x1="0" y1="${y}" x2="400" y2="${y}" />`;
        }
      }
      
      staticSvgContent += `</g>
        <!-- 중심 축 -->
        <g stroke="#64748b" stroke-width="2">
          <line x1="0" y1="200" x2="400" y2="200" /> <!-- X축 -->
          <line x1="200" y1="0" x2="200" y2="400" /> <!-- Y축 -->
        </g>
        <!-- 축 라벨 및 눈금 숫자 -->
        <text x="380" y="215" fill="#64748b" font-size="12" font-weight="bold">x</text>
        <text x="210" y="20" fill="#64748b" font-size="12" font-weight="bold">y</text>
        <text x="365" y="190" fill="#94a3b8" font-size="10">10</text>
        <text x="15" y="190" fill="#94a3b8" font-size="10">-10</text>
        <text x="205" y="35" fill="#94a3b8" font-size="10">100</text>
        <text x="205" y="375" fill="#94a3b8" font-size="10">-100</text>
        <!-- 원점 텍스트 -->
        <text x="205" y="215" fill="#64748b" font-size="12">0</text>
      `;

      // 전체 그래프 곡선 경로 미리 계산 (부드러운 곡선을 위해 0.2 단위로 촘촘히 계산)
      let pathY1 = "";
      let pathY2 = "";
      const step = 0.2; 
      for (let i = -10; i <= 10; i += step) {
        const px = mapX(i);
        const py1 = mapY(i * i);
        const py2 = mapY(-(i * i));
        pathY1 += `${i === -10 ? 'M' : 'L'} ${px} ${py1} `;
        pathY2 += `${i === -10 ? 'M' : 'L'} ${px} ${py2} `;
      }

      // 화면 업데이트 함수
      const updateView = () => {
        const rawValue = xInput.value;
        const parsed = parseFloat(rawValue);
        const xValue = isNaN(parsed) ? 0 : parsed;

        // y값 계산
        const y1 = xValue * xValue;
        const y2 = -(xValue * xValue);

        // 텍스트 업데이트
        y1Formula.textContent = `y = (${xValue})²`;
        y2Formula.textContent = `y = -(${xValue})²`;
        
        y1Result.textContent = y1.toLocaleString('en-US', { maximumFractionDigits: 4 });
        y2Result.textContent = y2.toLocaleString('en-US', { maximumFractionDigits: 4 });

        // 점 위치 계산
        const px = mapX(xValue);
        const py1 = mapY(y1);
        const py2 = mapY(y2);

        // 동적 SVG 콘텐츠 생성 (그래프 곡선, 점, 선)
        let dynamicSvgContent = `<g>`;
        
        // 버튼 상태에 따라 전체 그래프 곡선 추가
        if (showGraphY1) {
          dynamicSvgContent += `<path d="${pathY1}" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5" stroke-linecap="round" stroke-linejoin="round" />`;
        }
        if (showGraphY2) {
          dynamicSvgContent += `<path d="${pathY2}" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" stroke-linecap="round" stroke-linejoin="round" />`;
        }

        dynamicSvgContent += `
            <!-- x축 기준 세로 점선 -->
            <line x1="${px}" y1="${py2}" x2="${px}" y2="${py1}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" />
            
            <!-- y = x^2 위의 점 -->
            <circle cx="${px}" cy="${py1}" r="6" fill="#3b82f6" stroke="#fff" stroke-width="2" class="transition-all duration-300" />
            <text x="${px + 10}" y="${py1 - 10}" fill="#2563eb" font-size="14" font-weight="bold">
              (${xValue}, ${y1.toLocaleString('en-US', { maximumFractionDigits: 2 })})
            </text>

            <!-- y = -x^2 위의 점 -->
            <circle cx="${px}" cy="${py2}" r="6" fill="#ef4444" stroke="#fff" stroke-width="2" class="transition-all duration-300" />
            <text x="${px + 10}" y="${py2 + 20}" fill="#dc2626" font-size="14" font-weight="bold">
              (${xValue}, ${y2.toLocaleString('en-US', { maximumFractionDigits: 2 })})
            </text>
          </g>
        `;

        // SVG 전체 업데이트
        graphSvg.innerHTML = staticSvgContent + dynamicSvgContent;

        // 버튼 스타일 상태 업데이트
        btnGraphY1.className = showGraphY1 
          ? "flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-blue-500 bg-blue-50 transition-all font-medium text-blue-700 shadow-sm"
          : "flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-slate-200 bg-white hover:bg-slate-50 transition-all font-medium text-slate-600";
          
        btnGraphY2.className = showGraphY2 
          ? "flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-red-500 bg-red-50 transition-all font-medium text-red-700 shadow-sm"
          : "flex items-center space-x-2 px-4 py-2 rounded-full border-2 border-slate-200 bg-white hover:bg-slate-50 transition-all font-medium text-slate-600";
      };

      // 입력 이벤트 리스너 등록
      xInput.addEventListener('input', updateView);

      // 버튼 클릭 이벤트 리스너 등록
      btnGraphY1.addEventListener('click', () => {
        showGraphY1 = !showGraphY1;
        updateView();
      });

      btnGraphY2.addEventListener('click', () => {
        showGraphY2 = !showGraphY2;
        updateView();
      });

      // 초기 렌더링
      updateView();
    });
  </script>
</body>
</html>
